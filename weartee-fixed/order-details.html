<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Details — WEARTEE</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23B76E79'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%23F4EBE4' font-family='Georgia' font-weight='bold'>W</text></svg>"
    />
  </head>
  <body data-page="orders">
    <main class="container">
      <nav class="crumbs">
        <a href="index.html">Home</a><span class="sep">/</span>
        <a href="orders.html">My Orders</a><span class="sep">/</span
        ><span class="here" id="crumbOrder">Order</span>
      </nav>
      <div style="padding: 14px 0 0">
        <a href="orders.html" class="back-link">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
          Back to Orders
        </a>
      </div>

      <div class="od-grid" id="odGrid">
        <div class="od-main">
          <div id="successBanner"></div>

          <div class="od-card">
            <div class="od-head">
              <div>
                <h1 id="odTitle">Order #WT00000</h1>
                <span class="od-date" id="odDate"></span>
              </div>
              <span id="odStatus"></span>
            </div>

            <div class="timeline" id="timeline">
              <div class="tl-step" data-step="confirmed">
                <div class="tl-dot">
                  <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 6 9 17l-5-5" />
                  </svg>
                </div>
                <div class="tl-name">Confirmed</div>
                <div class="tl-date" id="tlDate1"></div>
              </div>
              <div class="tl-step" data-step="shipped">
                <div class="tl-dot">
                  <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"
                    />
                    <path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2" />
                    <circle cx="7" cy="18" r="2" />
                    <circle cx="17" cy="18" r="2" />
                  </svg>
                </div>
                <div class="tl-name">Shipped</div>
                <div class="tl-date" id="tlDate2"></div>
              </div>
              <div class="tl-step" data-step="out">
                <div class="tl-dot">
                  <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M8 3h8l4 8v4H4v-4z" />
                    <path d="M4 15v4h16v-4" />
                    <path d="M8 19a2 2 0 1 0 0-4" />
                    <circle cx="16" cy="19" r="2.5" />
                  </svg>
                </div>
                <div class="tl-name">Out for Delivery</div>
                <div class="tl-date" id="tlDate3"></div>
              </div>
              <div class="tl-step" data-step="delivered">
                <div class="tl-dot">
                  <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M3 11 12 2l9 9" />
                    <path d="M5 9v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9" />
                    <path d="M9 21v-6h6v6" />
                  </svg>
                </div>
                <div class="tl-name">Delivered</div>
                <div class="tl-date" id="tlDate4"></div>
              </div>
            </div>
          </div>

          <div class="od-card">
            <h2 style="font-size: 1.3rem; margin-bottom: 6px">
              Items in This Order
            </h2>
            <div class="od-items" id="odItems"></div>
          </div>

          <div class="od-card">
            <h2 style="font-size: 1.3rem; margin-bottom: 16px">
              Shipping Address
            </h2>
            <p id="odAddress" style="color: var(--brown-700)"></p>
            <hr class="divider" />
            <h2 style="font-size: 1.3rem; margin-bottom: 10px">
              Payment Method
            </h2>
            <p id="odPayment" style="color: var(--brown-700)"></p>
          </div>
        </div>

        <aside class="summary-card">
          <h3>Order Summary</h3>
          <div class="sum-row">
            <span id="sumItemsLabel">Items</span><span id="sumItems"></span>
          </div>
          <div class="sum-row">
            <span>Subtotal</span><span id="sumSubtotal"></span>
          </div>
          <div class="sum-row">
            <span>Shipping</span><span id="sumShipping"></span>
          </div>
          <div class="sum-row total">
            <span>Total</span><span class="val" id="sumTotal"></span>
          </div>
          <p class="sum-note">
            Questions about this order? weartee.ng@gmail.com
          </p>
          <a href="shop.html" class="btn btn-primary btn-block"
            >Continue Shopping</a
          >
        </aside>
      </div>
    </main>

    <script>
      window.WEARTEE_API = ["localhost", "127.0.0.1"].includes(
        location.hostname,
      )
        ? "http://localhost:5050"
        : location.origin;
    </script>
    <script src="js/products.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/order-details.js"></script>
  </body>
</html>
